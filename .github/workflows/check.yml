name: Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check .

      - name: Typecheck
        run: bunx tsc --noEmit

      # `bun test` is intentionally not run here: it is an integration suite
      # that needs a live Postgres with pg_trgm and writes to a real database.
